# Values used with the wrong type (orange): TypeError and ValueError.

[[card]]
id = "input-is-string"
title = "`{input_name}` holds text from `input()`, not a number"
match = { code = "TypeError", message = "^(can only concatenate str|unsupported operand type|'.+' not supported between|not all arguments converted during string formatting)", when = { input_name = true } }
rule = "`input()` always gives back text (a `str`), even when the user types digits. Convert it with `int()` or `float()` before doing maths with it or comparing it with numbers."
why = "Python can't know what the user will type: `42`, `forty-two`, or nothing at all. So `input()` returns exactly the characters typed and leaves it to you to say whether they should be a number."
hints = [
  "Where does `{input_name}` get its value? Look at line {input_line}.",
  "What type does `input()` give back, even when someone types `5`?",
  "Wrap the `input(...)` on line {input_line} in `int(...)`.",
]
fix = "int_input"
related = ["str-plus-int", "int-conversion"]
examples = [
  { source = "age = input(\"Age? \")\nprint(age + 1)\n", inputs = ["14"], after = "age = int(input(\"Age? \"))" },
  { source = "n = input()\ntotal = 10 * 2 + n\n", inputs = ["3"], after = "n = int(input())" },
  { source = "age = input()\nif age >= 18:\n    print('adult')\n", inputs = ["20"], after = "age = int(input())" },
  { source = "number = input()\nif number % 2 == 0:\n    print('even')\n", inputs = ["7"], after = "number = int(input())" },
  { source = "total = 0\namount = input()\ntotal += amount\n", inputs = ["5"], after = "amount = int(input())" },
]

[card.quiz]
question = "Someone types 7 when your program calls `input()`. What do you get?"
choices = ["The number 7", "The text \"7\"", "Nothing until you press Run again"]
answer = 1
explain = "input() always gives back text. Convert it with int() before doing maths."

[[card]]
id = "str-plus-int"
title = "`+` can't join text with a value of type `{right_type}` (line {line})"
match = { code = "TypeError", message = "^can only concatenate str \\(not \"" }
rule = "`+` joins text to text, or adds numbers to numbers. To put a number into text, convert it with `str()`, or use an f-string: `f\"Age: {{age}}\"`."
why = "Python won't guess whether `\"3\" + 4` should be `\"34\"` or `7`. Each type decides what `+` means for itself, and text only knows how to join with more text, so mixing them is an error instead of a silent surprise."
hints = [
  "What type of value is on each side of the `+` on line {line}?",
  "The left side is text (type `str`) and the right side is of type `{right_type}`.",
  "Turn the right side into text with `str(...)`, or use an f-string.",
]
fix = "str_right_operand"
related = ["input-is-string"]
examples = [
  { source = "age = 15\nprint(\"Age: \" + age)\n", after = "print(\"Age: \" + str(age))" },
]

[card.quiz]
question = "What happens with `\"Age: \" + 15`?"
choices = ["It prints Age: 15", "Python stops with a TypeError", "It gives 15"]
answer = 1
explain = "`+` can't join text and a number. Use `str(15)` or an f-string: `f\"Age: {age}\"`."

[[card]]
id = "called-shadowed-builtin"
title = "`{called_name}` no longer refers to Python's `{called_name}()`"
match = { code = "TypeError", message = "is not callable$", when = { shadowed_builtin = true } }
rule = "Don't use the names of built-in functions (such as `list`, `sum`, `max` or `input`) for your own variables."
why = "Built-in names aren't protected. Assigning to `{called_name}` makes it point at your value instead, so a later `{called_name}(...)` tries to call that value (of type `{obj_type}`) as if it were a function."
hints = [
  "Where else in your program is `{called_name}` given a value?",
  "Assigning to `{called_name}` replaced Python's built-in function with your value.",
  "Rename your variable to something that describes it, so `{called_name}` means the built-in again.",
]
related = ["builtin-shadowed"]
examples = [
  { source = "sum = 0\nfor n in [1, 2]:\n    sum += n\nprint(sum([3, 4]))\n" },
]

[[card]]
id = "not-callable"
title = "A value of type `{obj_type}` can't be called like a function"
match = { code = "TypeError", message = "is not callable$" }
rule = "Round brackets straight after something mean \"call it\": `name(...)`. Only functions (and things like classes) can be called."
why = "To Python, `x(...)` always means \"run x\". A value of type `{obj_type}` is data, not something that can be run, so Python can't do what the brackets ask."
hints = [
  "What comes straight before the `(` on line {line}?",
  "That's a value of type `{obj_type}`, not a function. Did you mean to multiply with `*`?",
  "In Python, multiplication is always written with `*`: `price * 2`, not `price(2)`.",
]
examples = [
  { source = "price = 10\ntotal = price(2)\n" },
]

[[card]]
id = "brackets-for-call"
title = "Use `( )`, not `[ ]`, to call `{subscript_value}`"
match = { code = "TypeError", message = "is not subscriptable$", when = { is_function = true } }
rule = "Round brackets call a function: `len(word)`. Square brackets pick an item from a list, string or dictionary: `word[0]`."
why = "`[ ]` asks a value for one of its items, and a function doesn't have items. `name[...]` and `name(...)` mean different things, so Python won't guess which you meant."
hints = [
  "Look at the brackets after `{subscript_value}` on line {line}.",
  "Square brackets pick an item; round brackets call a function.",
  "Change the `[ ]` after `{subscript_value}` to `( )`.",
]
fix = "brackets_to_call"
examples = [
  { source = "word = \"hello\"\nprint(len[word])\n", after = "print(len(word))" },
]

[[card]]
id = "not-subscriptable"
title = "A value of type `{obj_type}` has no items to pick with `[ ]`"
match = { code = "TypeError", message = "is not subscriptable$" }
rule = "Square brackets pick an item from something that holds items: a list, a string, a tuple or a dictionary. Single values, such as numbers, don't hold items."
why = "`x[0]` asks for the first item of `x`. A value of type `{obj_type}` is a single value, so there's no first item to give back. Often the variable holds a different value from the one you expect at this point."
hints = [
  "What value does the variable before `[` hold when line {line} runs?",
  "It's of type `{obj_type}`, which doesn't contain items.",
  "To get the digits of a number, turn it into text first: `str(n)[0]`.",
]
examples = [
  { source = "year = 2024\nprint(year[0])\n" },
]

[[card]]
id = "int-not-iterable"
title = "Use `range()` to loop a number of times"
match = { code = "TypeError", message = "^'int' object is not iterable", when = { in_for = true } }
rule = "A `for` loop goes through the items of something: a list, a string, or a `range`. To repeat something 5 times, loop over `range(5)`."
why = "`for` asks a value for its items, one at a time. A number is a single value with no items, so there's nothing to go through. `range(5)` turns the number into the sequence 0, 1, 2, 3, 4."
hints = [
  "What does the `for` loop on line {line} go through?",
  "A number has no items to loop over. What turns a number into a sequence of numbers?",
  "Loop over `range(...)` of that number.",
]
fix = "wrap_range"
examples = [
  { source = "for i in 5:\n    print(i)\n", after = "for i in range(5):" },
  { source = "names = [\"Ana\", \"Bo\"]\nfor i in len(names):\n    print(names[i])\n", after = "for i in range(len(names)):" },
]

[card.quiz]
question = "How do you repeat something 5 times with a for loop?"
choices = ["`for i in 5:`", "`for i in range(5):`", "`for 5 times:`"]
answer = 1
explain = "A for loop goes through a sequence. range(5) gives the numbers 0 to 4."

[[card]]
id = "str-immutable"
title = "Text can't be changed in place"
match = { code = "TypeError", message = "^'str' object does not support item assignment" }
rule = "Strings are immutable: once made, their characters can't be changed. Build a new string instead, for example with slicing or `.replace()`."
why = "Because a string never changes, Python can safely share it between variables and use it as a dictionary key. The trade-off is that `word[0] = \"b\"` isn't allowed; you write `word = \"b\" + word[1:]` to make a new string."
hints = [
  "Line {line} tries to change one character of a string.",
  "Strings can't be changed, but you can make a new one.",
  "Build a new string from pieces, for example `\"b\" + word[1:]`, and store it.",
]
examples = [
  { source = "word = \"cat\"\nword[0] = \"b\"\n" },
]

[[card]]
id = "missing-argument"
title = "`{function}()` needs a value for {missing_args}"
match = { code = "TypeError", message = "missing \\d+ required" }
rule = "When you call a function, give it one value for each parameter in its `def` line, unless that parameter has a default."
why = "Inside the function, {missing_args} would have no value, and Python won't make one up. It stops at the call so you can see which values are missing."
hints = [
  "Look at the `def` line of `{function}`. How many parameters does it have?",
  "Now count the values given to `{function}()` on line {line}.",
  "Add a value for {missing_args} to the call.",
]
examples = [
  { source = "def greet(name):\n    print(\"Hi \" + name)\n\ngreet()\n" },
]

[[card]]
id = "int-conversion-decimal"
title = "`int()` can't read the decimal number {value}"
match = { code = "ValueError", when = { target_type = "int", value_is_decimal = true } }
rule = "`int()` only reads whole numbers from text. For text like {value}, use `float()`, or `int(float(...))` to drop the decimals."
why = "Text like {value} might be a precise amount, so `int()` refuses rather than silently throwing away the part after the decimal point."
hints = [
  "The text {value} contains a decimal point.",
  "`int()` only understands whole numbers written as text.",
  "Use `float(...)` instead of `int(...)`.",
]
related = ["int-conversion"]
examples = [
  { source = "price = int(\"3.50\")\n" },
]

[[card]]
id = "int-conversion"
title = "{value} can't be turned into a number"
match = { code = "ValueError", when = { target_type = true } }
rule = "`int()` only converts text made of digits, such as `\"42\"`, and `float()` also accepts decimals, such as `\"3.5\"`. Other text can't be converted."
why = "Converting text to a number only works when the text really is a number. Python shows you the exact text it was given, {value}, rather than guessing a number."
hints = [
  "Python shows what `{target_type}()` was given: {value}.",
  "Check what the user typed or what the variable held. Letters, spaces inside the number, and empty text can't be converted.",
  "Make sure the text is a number before converting it.",
]
related = ["input-is-string"]
examples = [
  { source = "age = int(\"twelve\")\n" },
  { source = "n = int(input(\"Number: \"))\n", inputs = [""] },
]

[[card]]
id = "too-many-arguments"
title = "`{function}()` was given {given} values but takes {takes}"
match = { code = "TypeError", message = "takes \\d+ positional arguments? but \\d+ (was|were) given" }
rule = "A function takes as many values as it has parameters in its `def` line."
why = "Python matches each value in the call to a parameter, in order. `{function}()` has room for {takes}, but the call gives it {given}, and Python won't guess what to do with the extra ones."
hints = [
  "Look at the `def` line of `{function}`. How many parameters does it have?",
  "Count the values in the call on line {line}.",
  "Remove the extra values from the call, or add parameters to the `def` line.",
]
related = ["missing-argument"]
examples = [
  { source = "def greet(name):\n    print('Hi', name)\n\ngreet('Ada', 'Sam')\n" },
]

[[card]]
id = "none-in-calculation"
title = "A `None` got into a calculation on line {line}"
match = { code = "TypeError", when = { none_operand = true } }
priority = 5
rule = "`None` means \"no value\", so it can't be added, multiplied or compared. It usually comes from a function that has no `return`."
why = "Every function gives back a value, and one that ends without `return` gives back `None`. Using that result in a calculation fails here, on the first line that relies on it."
hints = [
  "Which value in the calculation on line {line} is `None`?",
  "If it comes from calling a function, does that function `return` anything?",
  "Make the function end with `return` and the value it works out.",
]
related = ["missing-return", "none-attribute"]
examples = [
  { source = "def double(n):\n    print(n * 2)\n\nresult = double(4) + 1\n" },
  { source = "def area(r):\n    print(3.14 * r * r)\n\nprint(f\"{area(2):.2f}\")\n" },
]

[[card]]
id = "none-not-subscriptable"
title = "`None` has no items to pick with `[ ]`"
match = { code = "TypeError", message = "^'NoneType' object is not subscriptable" }
priority = 5
rule = "A variable is `None` when it was given the result of something that returns nothing, such as `.sort()` or a function without `return`."
why = "`[ ]` asks a value for one of its items, and `None` has none. Usually the variable was meant to hold a list, but got `None` from an in-place method or a function that only prints."
hints = [
  "Where does the value before `[` on line {line} come from?",
  "Methods like `.sort()` change a list and give back `None`; functions without `return` give back `None` too.",
  "Keep using the original list after `.sort()`, or make the function `return` its result.",
]
related = ["none-from-inplace-method"]
examples = [
  { source = "numbers = [3, 1, 2]\nordered = numbers.sort()\nprint(ordered[0])\n" },
]

[[card]]
id = "len-of-number"
title = "`len()` can't measure a `{obj_type}`"
match = { code = "TypeError", message = "^object of type '\\w+' has no len\\(\\)" }
rule = "`len()` counts the items in something that holds items: a string, list, tuple or dictionary. A single number has no length."
why = "`len(\"hello\")` is 5 because the text has 5 characters, but a number isn't a sequence of anything, so there's nothing to count. To count a number's digits, turn it into text first: `len(str(n))`."
hints = [
  "What value is given to `len()` on line {line}?",
  "It's a `{obj_type}`, which doesn't contain items.",
  "Did you mean to measure a list or text instead? For digits, use `len(str(...))`.",
]
examples = [
  { source = "year = 2024\nprint(len(year))\n" },
]

[[card]]
id = "list-index-not-int"
title = "A list position must be a whole number, not a `{index_type}`"
match = { code = "TypeError", message = "^list indices must be integers or slices" }
rule = "List items are picked by a whole-number position: `items[0]`, `items[2]`. Text like `\"0\"` isn't a position, even if it looks like one."
why = "A list is numbered 0, 1, 2 and so on, so Python needs an `int` to know which item you mean. A position from `input()` is text, so convert it with `int()` first."
hints = [
  "What is inside the `[ ]` on line {line}?",
  "It's a `{index_type}`, but list positions are whole numbers.",
  "Convert it with `int(...)`, or use a dictionary if you want to look things up by name.",
]
examples = [
  { source = "items = ['a', 'b']\nprint(items['1'])\n" },
]

[[card]]
id = "sequence-times-float"
title = "Text or a list can only be repeated a whole number of times"
match = { code = "TypeError", message = "^can't multiply sequence by non-int" }
rule = "`*` with text or a list repeats it: `\"ab\" * 3` is `\"ababab\"`. The number of repeats must be a whole number (an `int`)."
why = "You can't repeat something two and a half times, so Python refuses a `{factor_type}`. Often one side was meant to be a number but is still text, for example straight from `input()`."
hints = [
  "What types are the two sides of the `*` on line {line}?",
  "One side is text or a list. Was it meant to be a number?",
  "Convert the text with `float(...)` or `int(...)` before multiplying.",
]
examples = [
  { source = "price = '2.50'\nprint(price * 1.5)\n" },
]

[[card]]
id = "unpack-mismatch"
title = "The number of names doesn't match the number of values"
match = { code = "ValueError", when = { unpack = true } }
rule = "`a, b = values` gives each name one value, so there must be exactly as many names on the left as values on the right."
why = "Python unpacks the values in order, one per name. With {unpack} values for {names} names, some name would be left without a value, or a value without a name, and Python won't guess which."
hints = [
  "How many names are on the left of the `=` on line {line}?",
  "How many values does the right side hold?",
  "Make the counts match, or use `items[0]`, `items[1]`… to pick values one at a time.",
]
examples = [
  { source = "first, second = [1, 2, 3]\n" },
  { source = "a, b, c = 'hi'\n" },
]

[[card]]
id = "number-plus-text"
title = "`+` can't add text to a number (line {line})"
match = { code = "TypeError", message = "^unsupported operand type\\(s\\) for \\+=?: '(int|float)' and 'str'" }
rule = "`+` adds numbers to numbers. To add a number written as text, such as `\"7\"`, convert it first with `int()` or `float()`."
why = "Python won't guess whether you meant to add or to join, so mixing a number and text is an error rather than a surprise. Values taken out of text, like each character in `\"123\"`, are still text."
hints = [
  "What type is each side of the `+` on line {line}?",
  "The left side is a number and the right side is text (type `str`).",
  "Wrap the text in `int(...)` so both sides are numbers.",
]
fix = "int_right_operand"
related = ["input-is-string", "str-plus-int"]
examples = [
  { source = "total = 0\nfor digit in \"123\":\n    total += digit\nprint(total)\n", after = "    total += int(digit)" },
]
