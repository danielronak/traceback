id = "average"
title = "The average"
prompt = """
Write a function `average(numbers)` that returns the average (the mean) of a
list of numbers: their total divided by how many there are. For an empty
list, return `0`.
"""
starter = '''
def average(numbers):
    return sum(numbers) / len(numbers)
'''
solution = '''
def average(numbers):
    if not numbers:
        return 0
    return sum(numbers) / len(numbers)
'''
hints = [
  "The starter works for most lists. What happens with an empty one?",
  "How many numbers are in an empty list, and what happens when you divide by that?",
  "Check for an empty list first, before dividing.",
]
tests = [
  { call = "average([2, 4])", expect = "3.0" },
  { call = "average([1, 2])", expect = "1.5" },
  { call = "average([])", expect = "0" },
]
