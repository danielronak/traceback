id = "times-table"
title = "Times table"
prompt = """
Ask which times table to show, then print it from 1 to 10. For `3`, the
first lines are:

    3 x 1 = 3
    3 x 2 = 6
"""
starter = '''
n = input("Which table? ")
# Print the table from 1 to 10
'''
solution = '''
n = int(input("Which table? "))
for i in range(1, 11):
    print(f"{n} x {i} = {n * i}")
'''
hints = [
  "`range(1, 11)` gives the numbers 1 to 10.",
  "An f-string puts values into text: `f\"{a} x {b}\"`.",
  "`input()` gives back text. What does `\"3\" * 2` give?",
]
tests = [
  { inputs = ["3"], output = "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n3 x 10 = 30" },
]
