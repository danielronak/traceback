[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pymentor-training"
version = "0.1.0.dev0"
description = "PyMentor's tutor model: fine-tuning, evaluation and export (M6, M7)."
readme = "README.md"
requires-python = ">=3.13"
# Heavy and dev-only: never needed by the app, the engine or the pipeline.
# transformers stays below 4.58 because the ONNX exporter (optimum-onnx) needs
# it, and one environment should train, export and evaluate (D43).
dependencies = [
  "pymentor",
  "pymentor-pipeline",
  "torch>=2.5",
  "transformers>=4.46,<4.58",
  "optimum-onnx>=0.1",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnx-ir",  # needed by onnxruntime's 4-bit quantiser
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pymentor-training = "pymentor_training.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
pymentor = { path = "../engine", editable = true }
pymentor-pipeline = { path = "../pipeline", editable = true }
