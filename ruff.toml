target-version = "py313"
line-length = 100
# Seed programs are deliberately beginner-style code, checked by the engine instead.
extend-exclude = ["pipeline/corpus/programs"]

[lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "RUF",      # ruff-specific
]

[lint.per-file-ignores]
# Test snippets intentionally contain beginner mistakes inside strings.
"engine/tests/**" = ["E501"]
"pipeline/tests/**" = ["E501"]

[lint.isort]
known-first-party = ["pymentor", "pymentor_pipeline"]
