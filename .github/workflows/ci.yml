name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e "engine[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest engine
