name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what the browser ships (Pyodide 314); 3.13 covers learners'
        # own Python in the VS Code extension (D25).
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "engine[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest engine

  pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e engine -e "pipeline[dev]"
      - name: Test
        # Includes the frozen benchmark's checksum test and the harness.
        run: pytest pipeline

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        # The CPU build of PyTorch is a fraction of the default download.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e engine -e pipeline -e "training[dev]"
      - name: Test
        # A tiny model built on the spot: trains, resumes, exports to ONNX, scores.
        run: pytest training

  windows:
    # The owner trains on a Windows laptop (D46): the same tests, on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e "engine[dev]" -e pipeline -e "training[dev]"
      # One suite per step: in PowerShell a multi-line step only fails if its
      # last command does, which once hid a failure here.
      - name: Test the engine
        run: pytest engine
      - name: Test the pipeline
        run: pytest pipeline
      - name: Test training
        run: pytest training

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Engine self-check inside Pyodide
        run: npm run test:engine
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
